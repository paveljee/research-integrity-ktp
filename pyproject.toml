[tool.poetry]
name = "author-matching-project"
version = "0.1.0"
description = "A project to match author names to OpenAlex IDs and retrieve further details."
authors = ["Your Name <you@example.com>"] # Placeholder
readme = "README.md" # Assuming a README might be added later

[tool.poetry.dependencies]
python = ">=3.11,<4.0" # Specify a compatible Python version range, e.g., ^3.9, ^3.10, ^3.11, ^3.12
pandas = "2.3.0"
pyalex = "0.18"
ipykernel = "6.29.5"
pyarrow = "20.0.0"
openpyxl = "3.1.5"
rdflib = "7.1.4"
python-dotenv = "1.1.1"
numpy = "2.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

